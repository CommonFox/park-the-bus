[project]
name = "ptb-core"
version = "0.1.0"
description = "Universal soccer data collection and warehouse"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "requests>=2.32",
    "pyyaml>=6.0",
]

[project.scripts]
ptb = "ptb.core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ptb"]
